<nav aria-label="On this page">
  <details>
    <summary>On this page</summary>
    <ul class="nav flex-column">
      {% for item in page.toc recursive %}
      <li>
        <a href="{{ item.url }}">{{ item.title }}</a>
        {% if item.children %}<ul>{{ loop(item.children) }}</ul>{% endif %}
      </li>
      {% endfor %}
    </ul>
  </details>
</nav>
