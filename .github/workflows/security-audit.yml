# NEURO-EVIDENCE-BENCH — repository validation tooling

name: Blocking complete dependency audit
'on':
  workflow_call:
permissions:
  contents: read
concurrency:
  group: evidence-bench-security-audit-${{ github.ref }}
  cancel-in-progress: true
jobs:
  audit:
    name: audit
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      UV_LINK_MODE: hardlink
      UV_CACHE_DIR: ${{ github.workspace }}/.tool-cache/uv
      TMPDIR: ${{ github.workspace }}/.tool-cache/tmp
      PRE_COMMIT_HOME: ${{ github.workspace }}/.tool-cache/pre-commit
      RAYON_NUM_THREADS: '1'
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        persist-credentials: 'false'
    - name: Prepare bounded working directories
      run: mkdir -p .tool-cache/tmp .tool-cache/uv
    - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
      with:
        python-version: 3.15.2
    - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2
      with:
        version: 0.13.7
        checksum: c5221ff41b7892bfc223543883600125f6a47fe845093e0f5bdff4f359196d83
        enable-cache: 'false'
    - name: Install exact development graph
      run: 'uv venv --python 3.15.2 .venv

        uv pip install --python .venv/bin/python --require-hashes --build-constraints requirements-dev.txt
        --default-index https://pypi.org/simple -r requirements-dev.txt

        '
    - name: Install exact verified native validation tools
      run: make native-tools
    - name: Blocking complete dependency audit
      run: '.venv/bin/pip-audit -r requirements-dev.txt --disable-pip --no-deps --cache-dir .tool-cache/pip-audit

        .venv/bin/bandit --ini /dev/null --ignore-nosec --severity-level all --confidence-level all -r
        tools

        .venv/bin/zizmor --offline --no-progress --persona pedantic --min-severity informational .github/workflows

        .tool-cache/native/actionlint/actionlint -color=false

        .venv/bin/python tools/preflight.py --root . --check secret-scan --json

        '
  codeql:
    name: analysis
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        persist-credentials: 'false'
    - name: Retrieve the exact CodeQL analysis bundle
      env:
        CODEQL_BUNDLE_URL: https://github.com/github/codeql-action/releases/download/codeql-bundle-v2.27.4/codeql-bundle-linux64.tar.gz
        CODEQL_BUNDLE_SHA256: 89ed56c8ec6bfccef6a0d2e7fe86da0469ca24b4db08b88016ec134b942c17a4
      run: 'curl --fail --location --silent --show-error --max-time 180 --output "$RUNNER_TEMP/codeql-bundle.tar.gz"
        "$CODEQL_BUNDLE_URL"

        printf ''%s  %s\n'' "$CODEQL_BUNDLE_SHA256" "$RUNNER_TEMP/codeql-bundle.tar.gz" | sha256sum --check
        --status

        '
    - uses: github/codeql-action/init@1fc58d04a4d4374f921bdac573c3811c240f9c26
      with:
        languages: python
        tools: ${{ runner.temp }}/codeql-bundle.tar.gz
        build-mode: none
        ram: '2048'
        threads: '1'
    - uses: github/codeql-action/analyze@33d7b85da1a04171e211befe2c739303b9a4c066
      with:
        upload: never
        upload-database: 'false'
        wait-for-processing: 'false'
  sbom:
    name: sbom
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      UV_LINK_MODE: hardlink
      UV_CACHE_DIR: ${{ github.workspace }}/.tool-cache/uv
      TMPDIR: ${{ github.workspace }}/.tool-cache/tmp
      PRE_COMMIT_HOME: ${{ github.workspace }}/.tool-cache/pre-commit
      RAYON_NUM_THREADS: '1'
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        persist-credentials: 'false'
    - name: Prepare bounded working directories
      run: mkdir -p .tool-cache/tmp .tool-cache/uv
    - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
      with:
        python-version: 3.15.2
    - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2
      with:
        version: 0.13.7
        checksum: c5221ff41b7892bfc223543883600125f6a47fe845093e0f5bdff4f359196d83
        enable-cache: 'false'
    - name: Install exact development graph
      run: 'uv venv --python 3.15.2 .venv

        uv pip install --python .venv/bin/python --require-hashes --build-constraints requirements-dev.txt
        --default-index https://pypi.org/simple -r requirements-dev.txt

        '
    - name: Development supply-chain inventory
      run: '.venv/bin/cyclonedx-py environment .venv/bin/python --output-reproducible --of JSON -o .tool-cache/development-sbom.json

        '
  scorecard:
    name: local-supply-chain
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      UV_LINK_MODE: hardlink
      UV_CACHE_DIR: ${{ github.workspace }}/.tool-cache/uv
      TMPDIR: ${{ github.workspace }}/.tool-cache/tmp
      PRE_COMMIT_HOME: ${{ github.workspace }}/.tool-cache/pre-commit
      RAYON_NUM_THREADS: '1'
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        persist-credentials: 'false'
    - name: Prepare bounded working directories
      run: mkdir -p .tool-cache/tmp .tool-cache/uv
    - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
      with:
        python-version: 3.15.2
    - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2
      with:
        version: 0.13.7
        checksum: c5221ff41b7892bfc223543883600125f6a47fe845093e0f5bdff4f359196d83
        enable-cache: 'false'
    - name: Install exact development graph
      run: 'uv venv --python 3.15.2 .venv

        uv pip install --python .venv/bin/python --require-hashes --build-constraints requirements-dev.txt
        --default-index https://pypi.org/simple -r requirements-dev.txt

        '
    - name: Install exact verified native validation tools
      run: make native-tools
    - name: Local supply-chain policy; no hosted score
      run: '.venv/bin/python tools/check_source_provenance.py --root . --json

        .venv/bin/python tools/check_workflow_policy.py --root . --json

        .venv/bin/python tools/check_dependency_alignment.py --root . --json

        '
