# NEURO-EVIDENCE-BENCH — repository configuration

site_name: NEURO-EVIDENCE-BENCH
site_description: Local repository validation tooling for benchmark evidence development.
docs_dir: docs
site_dir: .tool-cache/site
strict: true
theme:
  name: mkdocs
  custom_dir: docs-overrides
  highlightjs: false
copyright: Concepts © 1996–2026 and code © 2020–2026 Miroslav Šotek
nav:
  - Overview: index.md
  - Validation tooling: validation-tooling.md
  - Architecture: ARCHITECTURE.md
  - Trust boundaries: THREAT_MODEL.md
  - Repository boundary: adr/0001-repository-boundary.md
exclude_docs: |
  internal/
plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          paths: [tools]
          options:
            docstring_style: numpy
            docstring_section_style: list
            show_source: false
markdown_extensions:
  - admonition
  - pymdownx.superfences
validation:
  links:
    anchors: warn
